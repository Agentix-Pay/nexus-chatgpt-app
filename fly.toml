# fly.toml app configuration file generated for agentix-nexus-app on 2026-05-05T18:11:21-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentix-nexus-app'
primary_region = 'iad'

[build]

[env]
  NEXUS_BASE_URL = 'https://agentix-nexus.fly.dev'
  NODE_ENV = 'production'
  PORT = '4400'

[http_service]
  internal_port = 4400
  force_https = true
  # Machine stays running 24/7 — never auto-stops, never scale-to-zero.
  # Critical for the demo path: someone else (CTO/CEO/VIP) may hit the App
  # at any hour and we can't pre-prime it for them. Combined with
  # min_machines_running=1 below, this locks the machine on. Trade-off is
  # ~$2/mo of shared-CPU time we'd otherwise save; cheap insurance.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
