# fly.toml app configuration file generated for agentix-nexus-app on 2026-05-05T18:11:21-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentix-nexus-app'
primary_region = 'iad'

[build]

[env]
  NEXUS_BASE_URL = 'https://agentix-nexus.fly.dev'
  NODE_ENV = 'production'
  PORT = '4400'

[http_service]
  internal_port = 4400
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
