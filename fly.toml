# Fly.io config for the Nexus ChatGPT App's MCP server.
# Hosted as HTTP/SSE so ChatGPT Apps platform can connect remotely.

app = "agentix-nexus-app"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "4400"
  NEXUS_BASE_URL = "https://agentix-nexus.fly.dev"
  # NEXUS_FALLBACK_API_KEY set as a Fly secret

[http_service]
  internal_port = 4400
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
