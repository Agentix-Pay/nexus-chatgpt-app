# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# ROLLBACK NET ONLY. During the Fly->AWS migration this is kept as a manual
# escape hatch: AWS is the primary deploy target (see deploy-aws-*.yml). It no
# longer auto-fires on branch pushes (the old `master` push trigger was dropped
# when the default branch was renamed master->main and AWS became canonical).
# Trigger by hand from the Actions tab if AWS Nexus needs to fall back to Fly.

name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
