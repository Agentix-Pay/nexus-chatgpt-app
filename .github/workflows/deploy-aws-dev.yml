name: Deploy Nexus ChatGPT App to AWS — Dev

# Auto-deploy the Nexus ChatGPT App dev on every merge to main (mirrors the
# dashboard repo's main->dev trigger). Runs on the SHARED EC2 box
# (agentix-shared-app) as part of the agentix-dev compose project. Talks to the
# Nexus core over the public dev hostname (NEXUS_BASE_URL derives from
# nexus_api_host inside remote-deploy-nexus.sh).

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-aws-nexus-app-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-aws.yml
    with:
      env: dev
      gh_environment: dev
      target_name_tag: agentix-shared-app
      nexus_host: nexus-dev.agentixpay.ai
      nexus_api_host: nexus-api-dev.agentixpay.ai
